    body {

    /* Laser Scan Line Animation */
    @keyframes laser-sweep {
      0% { top: 5%; opacity: 0.3; }
      50% { opacity: 1; }
      100% { top: 92%; opacity: 0.3; }
    }
    .laser-line {
      position: absolute;
      left: 6%;
      right: 6%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #ff1744, #ffffff, #d4af37, transparent);

      animation: laser-sweep 2.8s ease-in-out infinite alternate;
      z-index: 20;
      pointer-events: none;
    }
    /* Pulsing Glow Ring */
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 25px rgba(212, 175, 55, 0.4), 0 0 50px rgba(225, 29, 72, 0.25); }
      50% { box-shadow: 0 0 45px rgba(212, 175, 55, 0.8), 0 0 80px rgba(225, 29, 72, 0.5); }
    }
    .hologram-card {
      animation: pulseGlow 3.6s infinite ease-in-out;
    }
