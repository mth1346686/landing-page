version: '3.8'

services:
  web:
    build:
      context: ..
      dockerfile: deploy_docker/Dockerfile
    container_name: production_web_app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
